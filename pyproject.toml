[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "keithley_2400"
version = "0.1.0"
description = "SCPI driver for the Keithley 2400 SourceMeter"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
dependencies = ["PyVISA>=1.13", "pyvisa-py[serial]>=0.7"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["keithley2400"]

[tool.setuptools.package-data]
keithley2400 = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
